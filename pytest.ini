[pytest]
# `pytest` from the repo root runs the whole hermetic suite: temp SQLite DB,
# in-process TestClient, stubbed BTC prices. No server, no internet needed.
testpaths = backend/tests mcp_server/tests
pythonpath = . mcp_server
markers =
    slow: long-running stress tests (skipped by the pre-push hook, run in CI)
filterwarnings =
    # SQLAlchemy identity map warnings from SQLite autoincrement ID reuse
    # after delete-all + recreate cycles in tests. Harmless — data integrity
    # is correct, SQLite just reuses IDs when tables are emptied.
    ignore:Identity map already had an identity:sqlalchemy.exc.SAWarning
