[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "btctx-mcp"
version = "0.1.0"
description = "MCP server that lets an AI assistant add transactions to a BitcoinTX ledger"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.2,<3",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.scripts]
btctx-mcp = "btctx_mcp.server:main"

[tool.setuptools]
packages = ["btctx_mcp"]
