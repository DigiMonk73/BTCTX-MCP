# Dependabot version updates: weekly, one grouped PR per directory for
# minor and patch updates, majors one per PR (read the changelog first).
#
# Every entry targets develop: main holds released code only (AGENTS.md,
# "Branches"). GitHub reads this file from the default branch (main), so a
# change here takes effect once main is fast-forwarded to develop.
# Review and merge like any dependency change: docs/MAINTENANCE.md,
# "Updating a dependency". Ignored below: the deferred upgrades listed there,
# and what is bumped by hand.
#
# backend/, desktop/ and .github/release-tools/ are `uv` entries: each holds a
# requirements.in (what we name, pinned) and the requirements.txt lock that
# `uv pip compile` made from it (MAINTENANCE.md, "Pinning"). Dependabot edits
# the pin and recompiles the lock with the command in its header.
version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    groups:
      backend:
        update-types: [minor, patch]
    ignore:
      # Deferred: output drift in the tax report PDFs (MAINTENANCE.md)
      - dependency-name: reportlab
        versions: [">=4.5"]
      # Deferred: 2.1 needs Python 3.11; BitcoinTX supports 3.10
      - dependency-name: sqlalchemy
        versions: [">=2.1"]

  - package-ecosystem: pip
    directory: /mcp_server
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    groups:
      mcp-server:
        update-types: [minor, patch]

  # The Mac app's build tools. Only these two: the rest of the lock is held
  # to backend/'s versions (`make lock` after a backend PR that moves one the
  # two share; test_pinning.py says when).
  - package-ecosystem: uv
    directory: /desktop
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    allow:
      - dependency-name: pyinstaller
      - dependency-name: pywebview
    groups:
      desktop:
        update-types: [minor, patch]

  # What release.yml builds the AI connector with
  - package-ecosystem: uv
    directory: /.github/release-tools
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    groups:
      release-tools:
        update-types: [minor, patch]

  # Test and CI tools (requirements-dev.txt), not shipped in the app. At "/"
  # Dependabot also reads backend/ and desktop/ requirements (without the
  # rules above), so only these are allowed: add a new pinned dev tool here.
  - package-ecosystem: pip
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    allow:
      - dependency-name: pytest
      - dependency-name: hypothesis
      - dependency-name: ruff
      - dependency-name: pip-audit
      - dependency-name: anyio
      - dependency-name: uv
    groups:
      dev-tools:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    groups:
      frontend:
        update-types: [minor, patch]
    ignore:
      # Pinned to the browsers preinstalled in cloud sessions (TESTING.md)
      - dependency-name: "@playwright/test"
      # Deferred majors (MAINTENANCE.md): React 18, Vite 6, TypeScript 5,
      # ESLint 9 (moves with react-hooks 7); Node 22 in Docker and CI
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: vite
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint-plugin-react-hooks
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /startos
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    groups:
      startos:
        update-types: [minor, patch]
    ignore:
      # Bumped by hand (startos/UPDATING.md, "Bumping the SDK");
      # .github/workflows/startos-sdk-check.yml opens an issue for new SDKs
      - dependency-name: "@start9labs/start-sdk"
      - dependency-name: mempool-startos
      - dependency-name: tor-startos
      # The SDK's lint tools (typescript-eslint) need TypeScript < 6.1;
      # moves with the SDK
      - dependency-name: typescript
        versions: [">=6.1"]
      # Node 22 in CI
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # The Dockerfile's base images, pinned by digest: a new build of the same
  # tag (OS security fixes) comes as a PR. Python 3.11 and Node 22 change
  # only on purpose (MAINTENANCE.md).
  - package-ecosystem: docker
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  # Actions are pinned to a commit with the release as a comment; Dependabot
  # updates both. "/" covers /.github/workflows only, never
  # startos/.github/workflows (Start9's standard files, mirrored as they are).
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
