name: Release

# Push a branch named release/vX.Y.Z (matching VERSION; vX.Y.Z-N for a
# package-only revision N, see startos/UPDATING.md) from main to publish that release:
# one GitHub release, tag created on that commit, notes from the
# "## [<tag>]" section of docs/CHANGELOG.md (its summary and a link, when it
# has one: scripts/release-notes.sh), with
#   btctx.s9pk              StartOS package (signed with DEV_KEY if that secret exists)
#   BitcoinTX-macOS.dmg     macOS app, unsigned (its name from the build:
#   BitcoinTX-macOS.zip     scripts/mac-app.sh), and the same app zipped
#   SHA256SUMS              the SHA-256 of those three
# and a GitHub build provenance attestation of the three (`gh attestation
# verify <file> -R DigiMonk73/BTCTX-MCP`), so a download can be checked;
# the AI connector on PyPI (btctx-mcp==X.Y.Z, trusted publishing: the
# `pypi` environment, no token), and the image
# ghcr.io/digimonk73/btctx-mcp:vX.Y.Z (published here if main hasn't
# already). Then startos/ is mirrored to DigiMonk73/BTCTX-StartOS if the
# MIRROR_TOKEN secret exists; the mirror's own Tag and Release workflow
# (Start9's) tags and releases it there. Once Start9 has forked the mirror,
# a release stops at the start if Start9 changed their fork and startos/
# doesn't have it yet (scripts/start9-pull.sh --check), and after the mirror
# push an issue here holds the one-click link for the pull request to their
# fork (the only way a release reaches them). The hourly price history must
# be current and cross-checked (scripts/price_history.py release-check)
# before anything is built. Branch-based so a release
# doesn't depend on being able to push tags. An existing release is left
# alone. Setup of the two secrets: startos/UPDATING.md.
#
# A branch prerelease/vX.Y.Z-alpha.N or prerelease/vX.Y.Z-beta.N pushed from
# 2.0 publishes a 2.0 pre-release the same way (2.0 plan 7.4, B10a; #251's
# decision 28: alphas first, then betas): VERSION X.Y.Z-alpha.N (or -beta.N),
# current.ts the same with :0, a CHANGELOG section of its own. The Mac app is
# "BitcoinTX Preview" (BitcoinTX-Preview-macOS.dmg/.zip), the image only its
# own tag (scripts/image-tags.sh), the connector btctx-mcp==X.Y.ZaN (or bN),
# a pre-release on PyPI. The GitHub release is a pre-release, never
# "Latest", so releases/latest and the landing page stay on 1.x; it never
# reaches the mirror or Start9 (no start9-pull.sh --check, no mirror job).
# A pre-release's tag, like every v* tag, can't be moved or deleted
# ("Protect release tags"). The image and PyPI jobs run beside the Mac and
# StartOS builds, so a failed run may have published some of a version's
# files before any tag: its failed jobs are re-run on the same commit, or
# the next try is the next pre-release. The branch is never pushed again
# from another commit (the image would stay the first commit's, never
# overwritten).
on:
  push:
    branches: ['release/v*', 'prerelease/v*']

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      revision: ${{ steps.v.outputs.revision }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      connector: ${{ steps.v.outputs.connector }}
      exists: ${{ steps.v.outputs.exists }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # origin/main and origin/2.0, for the check below
      - name: Commit is on main (2.0 for a pre-release); branch, VERSION, CHANGELOG and package version agree
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # tag, version, revision, prerelease, base, connector; refuses a
          # branch that disagrees with VERSION, current.ts or the CHANGELOG
          scripts/release-version.sh "$GITHUB_REF_NAME" > version.env
          . ./version.env
          # Releases come from main only, a 2.0 pre-release from 2.0 (AGENTS.md, "Branches").
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/$base" \
            || { echo "$GITHUB_REF_NAME is not on $base: push release/ from main (fast-forwarded to develop), prerelease/ from 2.0's tip"; exit 1; }
          # The release job's notes, built now: too long for GitHub, the run
          # stops here, before PyPI has the version.
          scripts/release-notes.sh "$tag" > /dev/null
          cat version.env >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag already released; nothing to do"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Start9's changes to their fork are in startos/ (once they've forked it)
        # Not for a pre-release: it never reaches the mirror, and 2.0's release
        # brings Start9's changes in first (2.0 plan 7.4, B10b)
        if: steps.v.outputs.prerelease == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          START9_FORK: ${{ vars.START9_FORK }}
        run: scripts/start9-pull.sh --check
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: The hourly price history is well formed, current and cross-checked
        # scripts/price_history.py release-check: the manifest's newest 30
        # days still give their fingerprint and agree with Bitfinex and
        # Kraken, and it ends at most 14 days before this commit (`make
        # prices` in the bump pull request). A package-only revision (-N)
        # ships the history it had: no age check. A pre-release ships its own,
        # so it keeps the check.
        env:
          REVISION: ${{ steps.v.outputs.revision }}
        run: |
          pip install --require-hashes -r backend/requirements.txt
          if [ "$REVISION" != 0 ]; then age=(--no-age-check); else age=(--commit-time "$(git show -s --format=%ct "$GITHUB_SHA")"); fi
          python scripts/price_history.py release-check "${age[@]}"

  image:
    needs: check
    if: needs.check.outputs.exists == 'false'
    uses: ./.github/workflows/image.yml

  pypi:
    # The AI connector (mcp_server/) on PyPI as btctx-mcp==X.Y.Z (an alpha's
    # as X.Y.ZaN, a beta's as X.Y.ZbN, which PyPI lists as pre-releases: pip
    # and uv take one only when it's asked for by version). Trusted
    # publishing: PyPI trusts this workflow in the `pypi` environment, so no
    # token is stored anywhere. Skipped for a package-only revision (-N):
    # PyPI never takes the same version twice.
    needs: check
    if: needs.check.outputs.exists == 'false' && needs.check.outputs.revision == '0'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Build the connector
        # With the locked build and setuptools (hashes checked), not an
        # isolated build that fetches setuptools unchecked.
        run: |
          python -m pip install --require-hashes -r .github/release-tools/requirements.txt
          python -m build --no-isolation mcp_server --outdir dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist

  macos:
    needs: check
    if: needs.check.outputs.exists == 'false'
    runs-on: macos-latest
    outputs:
      dmg: ${{ steps.package.outputs.dmg }}
      zip: ${{ steps.package.outputs.zip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        with:
          python-version: "3.13"  # the Mac app's, on purpose and tested (#284): the newest in ci.yml's matrix
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Build the app (BitcoinTX, or BitcoinTX Preview for a pre-release)
        run: ./desktop/build-mac.sh
        env:
          # The Python set up above, never one the runner happens to have (#284)
          BTCTX_BUILD_PYTHON: ${{ steps.python.outputs.python-path }}
      - name: Launch check (its API answers on its own port, its data in its own folder)
        run: scripts/mac-app.sh check
      - name: Unsigned .dmg and .zip (same steps as ci.yml)
        id: package
        run: scripts/mac-app.sh package >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: |
            ${{ steps.package.outputs.dmg }}
            ${{ steps.package.outputs.zip }}

  s9pk:
    needs: [check, image]
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.pack.outputs.package }}
    env:
      # the same start-cli as ci.yml's START_CLI_VERSION and START_CLI_SHA256
      START_CLI_VERSION: v2.5.2
      START_CLI_SHA256: 539ef6ccd2ecc6b616f0f109377c397f4a537037bb9d2e002be9366cca8d0bff
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # npm ci builds diskusage (bitcoin-core-startos, via mempool-startos)
          # from source: a Node whose headers can't build it fails here (#32)
          node-version: 24
          cache: npm
          cache-dependency-path: startos/package-lock.json
      # Start9's guide asks for Docker 28.1 or later (environment-setup.md);
      # the runner's is older (Start9's own builds do the same). start-cli
      # takes the image with `docker image save --platform`, and from 2.4
      # makes the SquashFS image itself: no squashfs-tools
      - name: Docker (current release, containerd image store for multi-arch)
        uses: docker/setup-docker-action@7ec28a010822b4626af4874f9448a4b05ac6f3e5 # v5.6.0
        with:
          daemon-config: '{"features":{"containerd-snapshotter":true}}'
      - name: start-cli
        run: |
          sudo curl -sSL -o /usr/local/bin/start-cli \
            "https://github.com/Start9Labs/start-technologies/releases/download/start-cli%2F${START_CLI_VERSION}/start-cli_x86_64-linux"
          echo "${START_CLI_SHA256}  /usr/local/bin/start-cli" | sha256sum -c -
          sudo chmod +x /usr/local/bin/start-cli && start-cli --version
          docker version --format "Docker {{.Server.Version}}"
      - name: Pull the released image (both architectures)
        run: |
          IMAGE="ghcr.io/digimonk73/btctx-mcp:${{ needs.check.outputs.version }}"
          docker pull --platform linux/amd64 "$IMAGE"
          docker pull --platform linux/arm64 "$IMAGE"
      - name: Signing key (DEV_KEY, else a throwaway key)
        env:
          DEV_KEY: ${{ secrets.DEV_KEY }}
        run: startos/scripts/signing-key.sh "$GITHUB_WORKSPACE/.."
      - name: Pack btctx.s9pk
        id: pack
        working-directory: startos
        run: |
          npm ci
          make universal
          start-cli s9pk inspect btctx.s9pk manifest | tee manifest.json | jq '{id, version, gitHash, canMigrateFrom, canMigrateTo, images}'
          jq -e --arg v "${{ needs.check.outputs.version }}" \
            '.id == "btctx" and (.version | startswith(($v | ltrimstr("v")) + ":"))
             and (.gitHash | endswith("-modified") | not)
             and ([.images.main.arch[]] | sort) == ["aarch64", "x86_64"]' manifest.json
          echo "package=$(jq -r .version manifest.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: s9pk
          path: startos/btctx.s9pk

  release:
    needs: [check, macos, s9pk]
    runs-on: ubuntu-latest
    permissions:
      contents: write       # the tag and the release
      id-token: write       # the attestation's signing certificate (Sigstore)
      attestations: write   # the attestation, kept by GitHub for this repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # By name: when this run builds the image, build-push-action adds its
      # own build-record artifact, which an unnamed download would take too.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: s9pk
          path: dist
      - name: SHA256SUMS of the release files
        # No pipe into tee: the default shell has no pipefail, so a missing
        # file would still pass.
        working-directory: dist
        env:
          MAC_DMG: ${{ needs.macos.outputs.dmg }}
          MAC_ZIP: ${{ needs.macos.outputs.zip }}
        run: |
          sha256sum btctx.s9pk "$MAC_DMG" "$MAC_ZIP" > SHA256SUMS
          cat SHA256SUMS
      # Before the release exists: a failed attestation stops the run while
      # it can still be run again.
      - name: Attest the files SHA256SUMS lists
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
          VERSION: ${{ needs.check.outputs.version }}
          CONNECTOR: ${{ needs.check.outputs.connector }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
          MAC_DMG: ${{ needs.macos.outputs.dmg }}
          MAC_ZIP: ${{ needs.macos.outputs.zip }}
          # The StartOS package's own version (1.2.3:0): what StartOS and the
          # mirror's releases show, so it's in the title here too.
          PACKAGE: ${{ needs.s9pk.outputs.package }}
        run: |
          [ -n "$PACKAGE" ] || { echo "no package version from the s9pk job"; exit 1; }
          # A pre-release made a normal release would be "Latest" (gh's
          # default): anything but a plain true or false, from the check job,
          # stops here
          case "$PRERELEASE" in true | false) ;; *) echo "prerelease is '$PRERELEASE', not true or false"; exit 1 ;; esac
          case "$TAG" in
            *-alpha.* | *-beta.*) [ "$PRERELEASE" = true ] || { echo "$TAG is a pre-release, not marked one"; exit 1; }; STAGE="${TAG#*-}" ;;
            *) [ "$PRERELEASE" = false ] || { echo "$TAG is marked a pre-release but is neither an alpha nor a beta"; exit 1; } ;;
          esac
          REPO_URL="https://github.com/$GITHUB_REPOSITORY"
          if [ "$PRERELEASE" = true ]; then
            # A pre-release's notes open with what it is, how each platform
            # keeps a tester's records, and the way back (2.0 plan 7.4, B10a; 5.16)
            if [ "${STAGE%%.*}" = alpha ]; then what="an alpha of BitcoinTX 2.0, its earliest test stage"; else what="a beta of BitcoinTX 2.0"; fi
            cat > pre.md <<EOF
          **This is $what: a pre-release, for testing.** It's for people who choose to try 2.0 before it's released, and it may have bugs. Nobody gets it as an update: BitcoinTX's releases, Docker's \`:latest\`, the Mac app's download, the landing page and Start9's store stay on 1.x.

          - **Mac:** a separate app, **BitcoinTX Preview** (every alpha and beta of 2.0), installed beside BitcoinTX, with its own ledger, folder and port: your BitcoinTX and its ledger are never opened. Its icon is BitcoinTX's with a red PREVIEW band, and a banner above every page names the pre-release. It starts empty, and its ledger carries from one pre-release to the next. To try your records, download a backup in BitcoinTX (Settings, Backup & Restore) and restore it in BitcoinTX Preview's Settings.
          - **StartOS:** it updates your BitcoinTX in place. **Make a StartOS backup of BitcoinTX first**, and keep it: to go back to 1.x, uninstall BitcoinTX (which deletes its data) and restore that backup.
          - **Docker:** start it on a new volume and restore a backup into it. Started on your 1.x volume, it upgrades that ledger, and going back takes the steps in [Going back to 1.x]($REPO_URL/blob/$TAG/README.md#going-back-to-1x).

          What you enter in a pre-release can't go back to 1.x: 1.x can't read a 2.0 database or backup. Report what you find with the [2.0 pre-release report]($REPO_URL/issues/new?template=prerelease_report.yml), from a test ledger, never your real data; a security problem privately ([SECURITY.md]($REPO_URL/blob/main/SECURITY.md)). A fix comes in the next pre-release: until 2.0 is out, a StartOS server running one is offered no 1.x update.

          EOF
            scripts/release-notes.sh "$TAG" >> pre.md
            mv pre.md notes.md
            title="$TAG · pre-release · StartOS package $PACKAGE"
            cat >> notes.md <<EOF

          ## Downloads

          - **StartOS:** \`btctx.s9pk\`, package $PACKAGE. Make a StartOS backup of BitcoinTX first; then in StartOS, open **Sideload** and upload it: it updates your BitcoinTX in place.
          - **macOS:** \`$MAC_DMG\` (or the \`.zip\`), the separate app BitcoinTX Preview, whose icon has a red PREVIEW band. It is not signed by Apple: the first time, right-click (Control-click) BitcoinTX Preview in Applications and choose **Open**; on macOS 15 or later, open it once, then go to **System Settings > Privacy & Security** and click **Open Anyway**.
          - **Docker:** \`ghcr.io/digimonk73/btctx-mcp:$VERSION\` (amd64 and arm64), on a new volume. Never \`:latest\`, which stays on 1.x.
          - **AI connector:** \`uvx btctx-mcp==$CONNECTOR\` (a pre-release on PyPI); BitcoinTX Preview's Settings → Connect an AI Assistant has it ready to paste.
          EOF
          else
            scripts/release-notes.sh "$TAG" > notes.md
            title="$TAG · StartOS package $PACKAGE"
            cat >> notes.md <<EOF

          ## Downloads

          - **StartOS:** \`btctx.s9pk\`, package $PACKAGE. In StartOS, open **Sideload** and upload it; installs of earlier versions update in place.
          - **macOS:** \`$MAC_DMG\` (or the \`.zip\`). The app is not signed by Apple: the first time, right-click (Control-click) BitcoinTX in Applications and choose **Open**; on macOS 15 or later, open it once, then go to **System Settings > Privacy & Security** and click **Open Anyway**.
          - **Docker:** \`ghcr.io/digimonk73/btctx-mcp:$VERSION\` (amd64 and arm64).
          - **AI connector:** \`uvx btctx-mcp==$CONNECTOR\` (PyPI); Settings → Connect an AI Assistant has it ready to paste.
          EOF
          fi
          cat >> notes.md <<EOF
          - **Checking a download:** in the folder with your file and \`SHA256SUMS\`, \`shasum -a 256 -c --ignore-missing SHA256SUMS\` (Linux: \`sha256sum -c --ignore-missing SHA256SUMS\`) should say OK. With the GitHub CLI (signed in), \`gh attestation verify <file> -R DigiMonk73/BTCTX-MCP --signer-workflow DigiMonk73/BTCTX-MCP/.github/workflows/release.yml\` also checks that this repository's release workflow built it.
          EOF
          if [ "$PRERELEASE" = true ]; then kind=(--prerelease --latest=false); else kind=(); fi
          gh release create "$TAG" "${kind[@]}" --target "$GITHUB_SHA" --title "$title" --notes-file notes.md \
            dist/btctx.s9pk "dist/$MAC_DMG" "dist/$MAC_ZIP" dist/SHA256SUMS

  mirror:
    needs: [check, release]
    # A pre-release never reaches the mirror or Start9 (2.0 plan 7.4, B10a)
    if: needs.check.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write   # the reminder to open the pull request to Start9's fork
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the sync's start9-pull.sh --check looks back to our last sync
      - name: Mirror startos/ to DigiMonk73/BTCTX-StartOS, then the pull request to Start9
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          START9_FORK: ${{ vars.START9_FORK }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          if [ -z "$MIRROR_TOKEN" ]; then
            echo "::notice::MIRROR_TOKEN is not set: mirror not updated. Run scripts/sync-startos-mirror.sh --push by hand (startos/UPDATING.md)."
            exit 0
          fi
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          MIRROR_URL="https://x-access-token:${MIRROR_TOKEN}@github.com/DigiMonk73/BTCTX-StartOS.git" \
            scripts/sync-startos-mirror.sh --push "$RUNNER_TEMP/BTCTX-StartOS"
          echo "::notice::Pushed to the mirror: its Tag and Release workflow tags and releases it (needs REFERENCE_REGISTRY and DEV_KEY there; otherwise scripts/mirror-startos-release.sh by hand)."

          # Start9's fork gets the release only through a pull request from
          # the mirror (the token can't open one there): an open one of ours
          # already carries it; otherwise an issue here holds the link.
          FORK_INFO="$(scripts/start9-pull.sh --fork)"
          read -r FORK BRANCH <<< "$FORK_INFO"
          if [ -z "$FORK" ]; then
            echo "Start9 hasn't forked the mirror yet: no pull request to open."
            exit 0
          fi
          OPEN="$(gh pr list -R "$FORK" --state open --json headRepositoryOwner,number \
            --jq '.[] | select(.headRepositoryOwner.login == "DigiMonk73") | "#\(.number)"')"
          if [ -n "$OPEN" ]; then
            echo "::notice::Our pull request $OPEN on $FORK is still open; it now carries $TAG too."
            exit 0
          fi
          COMPARE="https://github.com/$FORK/compare/$BRANCH...DigiMonk73:BTCTX-StartOS:main?expand=1"
          NOTES="https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
          cat > body.md <<EOF
          $TAG is released and the StartOS package is on our mirror. Start9's copy, **$FORK**, only gets it through a pull request: only Start9 can change it.

          1. Open [this link]($COMPARE), signed in to GitHub. It shows "Comparing changes" from DigiMonk73/BTCTX-StartOS \`main\` into $FORK \`$BRANCH\`.
          2. Click **Create pull request**. Title: \`BitcoinTX $TAG\`. Description: the release notes, $NOTES
          3. Click **Create pull request** again. Start9 reviews it (their comments come by email), merges it and publishes it.
          4. Close this issue.

          Or ask Claude: "open the Start9 pull request for $TAG".
          EOF
          gh issue create -R "$GITHUB_REPOSITORY" --title "Send $TAG to Start9: open the pull request" --label start9,owner --body-file body.md
          echo "::warning::Open the pull request to $FORK: see the new issue \"Send $TAG to Start9\"."
