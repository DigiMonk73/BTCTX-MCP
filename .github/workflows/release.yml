name: Release

# Push a branch named release/vX.Y.Z (matching VERSION; vX.Y.Z-N for a
# package-only revision N, see startos/UPDATING.md) from main to publish that release:
# one GitHub release, tag created on that commit, notes from the
# "## [<tag>]" section of docs/CHANGELOG.md, with
#   btctx.s9pk              StartOS package (signed with DEV_KEY if that secret exists)
#   BitcoinTX-macOS.dmg     macOS app, unsigned
#   BitcoinTX-macOS.zip     the same app, zipped
# the AI connector on PyPI (btctx-mcp==X.Y.Z, trusted publishing: the
# `pypi` environment, no token), and the image
# ghcr.io/digimonk73/btctx-mcp:vX.Y.Z (published here if main hasn't
# already). Then startos/ is mirrored to DigiMonk73/BTCTX-StartOS if the
# MIRROR_TOKEN secret exists; the mirror's own Tag and Release workflow
# (Start9's) tags and releases it there. Once Start9 has forked the mirror,
# a release stops at the start if Start9 changed their fork and startos/
# doesn't have it yet (scripts/start9-pull.sh --check), and after the mirror
# push an issue here holds the one-click link for the pull request to their
# fork (the only way a release reaches them). Branch-based so a release
# doesn't depend on being able to push tags. An existing release is left
# alone. Setup of the two secrets: startos/UPDATING.md.
on:
  push:
    branches: ['release/v*']

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      exists: ${{ steps.v.outputs.exists }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # origin/main, for the check below
      - name: Commit is on main; branch, VERSION, CHANGELOG and package version agree
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Releases come from main only (AGENTS.md, "Branches").
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "$GITHUB_REF_NAME is not on main: fast-forward main to develop, then push release/ from main"; exit 1; }
          TAG="${GITHUB_REF_NAME#release/}"
          VERSION="v$(tr -d '[:space:]' < VERSION)"
          REVISION=$(sed -n "s/.*version: '${VERSION#v}:\([0-9]*\)'.*/\1/p" startos/startos/versions/current.ts)
          [ -n "$REVISION" ] || { echo "startos/startos/versions/current.ts is not ${VERSION#v}:<n>"; exit 1; }
          # vX.Y.Z for package revision 0; vX.Y.Z-N for a package-only revision N
          if [ "$REVISION" = 0 ]; then EXPECTED="$VERSION"; else EXPECTED="$VERSION-$REVISION"; fi
          [ "$TAG" = "$EXPECTED" ] || { echo "branch release/$TAG: VERSION and current.ts say $EXPECTED"; exit 1; }
          grep -q "^## \[$TAG\]" docs/CHANGELOG.md || { echo "no CHANGELOG section for $TAG"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already released; nothing to do"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Start9's changes to their fork are in startos/ (once they've forked it)
        env:
          GH_TOKEN: ${{ github.token }}
          START9_FORK: ${{ vars.START9_FORK }}
        run: scripts/start9-pull.sh --check

  image:
    needs: check
    if: needs.check.outputs.exists == 'false'
    uses: ./.github/workflows/image.yml

  pypi:
    # The AI connector (mcp_server/) on PyPI as btctx-mcp==X.Y.Z. Trusted
    # publishing: PyPI trusts this workflow in the `pypi` environment, so no
    # token is stored anywhere. Skipped for a package-only revision (-N):
    # PyPI never takes the same version twice.
    needs: check
    if: needs.check.outputs.exists == 'false' && !contains(needs.check.outputs.tag, '-')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Build the connector
        run: python -m pip install build && python -m build mcp_server --outdir dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  macos:
    needs: check
    if: needs.check.outputs.exists == 'false'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build BitcoinTX.app
        run: ./desktop/build-mac.sh
      - name: Launch check (API answers on :8765)
        run: |
          "desktop/dist/BitcoinTX.app/Contents/MacOS/BitcoinTX" > app.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8765/api/health | grep -q '"status":"ok"'; then
              pkill -f BitcoinTX.app || true
              exit 0
            fi
            sleep 2
          done
          cat app.log; exit 1
      - name: Unsigned .dmg and .zip
        run: |
          mkdir dmg
          cp -R desktop/dist/BitcoinTX.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname BitcoinTX -srcfolder dmg -ov -format UDZO BitcoinTX-macOS.dmg
          ditto -c -k --keepParent desktop/dist/BitcoinTX.app BitcoinTX-macOS.zip
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: |
            BitcoinTX-macOS.dmg
            BitcoinTX-macOS.zip

  s9pk:
    needs: [check, image]
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.pack.outputs.package }}
    env:
      START_CLI_VERSION: v2.1.0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Node 22.23.3's headers don't build diskusage (bitcoin-core-startos,
          # via mempool-startos): pinned until a later 22 does (issue #32)
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: startos/package-lock.json
      - name: Tools (squashfs, start-cli, containerd image store for multi-arch)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q squashfs-tools squashfs-tools-ng
          sudo curl -sSL -o /usr/local/bin/start-cli \
            "https://github.com/Start9Labs/start-technologies/releases/download/start-cli%2F${START_CLI_VERSION}/start-cli_x86_64-linux"
          sudo chmod +x /usr/local/bin/start-cli && start-cli --version
          echo '{"features":{"containerd-snapshotter":true}}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
      - name: Pull the released image (both architectures)
        run: |
          IMAGE="ghcr.io/digimonk73/btctx-mcp:${{ needs.check.outputs.version }}"
          docker pull --platform linux/amd64 "$IMAGE"
          docker pull --platform linux/arm64 "$IMAGE"
      - name: Signing key (DEV_KEY, else a throwaway key)
        env:
          DEV_KEY: ${{ secrets.DEV_KEY }}
        run: startos/scripts/signing-key.sh "$GITHUB_WORKSPACE/.."
      - name: Pack btctx.s9pk
        id: pack
        working-directory: startos
        run: |
          npm ci
          make universal
          start-cli s9pk inspect btctx.s9pk manifest | tee manifest.json | jq '{id, version, gitHash, canMigrateFrom, canMigrateTo, images}'
          jq -e --arg v "${{ needs.check.outputs.version }}" \
            '.id == "btctx" and (.version | startswith(($v | ltrimstr("v")) + ":"))
             and (.gitHash | endswith("-modified") | not)
             and ([.images.main.arch[]] | sort) == ["aarch64", "x86_64"]' manifest.json
          echo "package=$(jq -r .version manifest.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: s9pk
          path: startos/btctx.s9pk

  release:
    needs: [check, macos, s9pk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # By name: when this run builds the image, build-push-action adds its
      # own build-record artifact, which an unnamed download would take too.
      - uses: actions/download-artifact@v8
        with:
          name: macos
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: s9pk
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
          VERSION: ${{ needs.check.outputs.version }}
          # The StartOS package's own version (1.2.3:0): what StartOS and the
          # mirror's releases show, so it's in the title here too.
          PACKAGE: ${{ needs.s9pk.outputs.package }}
        run: |
          [ -n "$PACKAGE" ] || { echo "no package version from the s9pk job"; exit 1; }
          awk -v tag="$TAG" '
            $0 ~ "^## \\[" tag "\\]" {on=1; next}
            on && /^## \[/ {exit}
            on {print}
          ' docs/CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "no CHANGELOG section for $TAG"; exit 1; }
          cat >> notes.md <<EOF

          ## Downloads

          - **StartOS:** \`btctx.s9pk\`, package $PACKAGE. In StartOS, open **Sideload** and upload it; installs of earlier versions update in place.
          - **macOS:** \`BitcoinTX-macOS.dmg\` (or the \`.zip\`). The app is not signed by Apple: the first time, right-click (Control-click) BitcoinTX in Applications and choose **Open**; on macOS 15 or later, open it once, then go to **System Settings > Privacy & Security** and click **Open Anyway**.
          - **Docker:** \`ghcr.io/digimonk73/btctx-mcp:$VERSION\` (amd64 and arm64).
          - **AI connector:** \`uvx btctx-mcp==${VERSION#v}\` (PyPI); Settings → Connect an AI Assistant has it ready to paste.
          EOF
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG · StartOS package $PACKAGE" --notes-file notes.md \
            dist/btctx.s9pk dist/BitcoinTX-macOS.dmg dist/BitcoinTX-macOS.zip

  mirror:
    needs: [check, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write   # the reminder to open the pull request to Start9's fork
    steps:
      - uses: actions/checkout@v7
      - name: Mirror startos/ to DigiMonk73/BTCTX-StartOS, then the pull request to Start9
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          START9_FORK: ${{ vars.START9_FORK }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          if [ -z "$MIRROR_TOKEN" ]; then
            echo "::notice::MIRROR_TOKEN is not set: mirror not updated. Run scripts/sync-startos-mirror.sh --push by hand (startos/UPDATING.md)."
            exit 0
          fi
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          MIRROR_URL="https://x-access-token:${MIRROR_TOKEN}@github.com/DigiMonk73/BTCTX-StartOS.git" \
            scripts/sync-startos-mirror.sh --push "$RUNNER_TEMP/BTCTX-StartOS"
          echo "::notice::Pushed to the mirror: its Tag and Release workflow tags and releases it (needs REFERENCE_REGISTRY and DEV_KEY there; otherwise scripts/mirror-startos-release.sh by hand)."

          # Start9's fork gets the release only through a pull request from
          # the mirror (the token can't open one there): an open one of ours
          # already carries it; otherwise an issue here holds the link.
          FORK_INFO="$(scripts/start9-pull.sh --fork)"
          read -r FORK BRANCH <<< "$FORK_INFO"
          if [ -z "$FORK" ]; then
            echo "Start9 hasn't forked the mirror yet: no pull request to open."
            exit 0
          fi
          OPEN="$(gh pr list -R "$FORK" --state open --json headRepositoryOwner,number \
            --jq '.[] | select(.headRepositoryOwner.login == "DigiMonk73") | "#\(.number)"')"
          if [ -n "$OPEN" ]; then
            echo "::notice::Our pull request $OPEN on $FORK is still open; it now carries $TAG too."
            exit 0
          fi
          COMPARE="https://github.com/$FORK/compare/$BRANCH...DigiMonk73:BTCTX-StartOS:main?expand=1"
          NOTES="https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
          cat > body.md <<EOF
          $TAG is released and the StartOS package is on our mirror. Start9's copy, **$FORK**, only gets it through a pull request: only Start9 can change it.

          1. Open [this link]($COMPARE), signed in to GitHub. It shows "Comparing changes" from DigiMonk73/BTCTX-StartOS \`main\` into $FORK \`$BRANCH\`.
          2. Click **Create pull request**. Title: \`BitcoinTX $TAG\`. Description: the release notes, $NOTES
          3. Click **Create pull request** again. Start9 reviews it (their comments come by email), merges it and publishes it.
          4. Close this issue.

          Or ask Claude: "open the Start9 pull request for $TAG".
          EOF
          gh issue create -R "$GITHUB_REPOSITORY" --title "Send $TAG to Start9: open the pull request" --label start9,owner --body-file body.md
          echo "::warning::Open the pull request to $FORK: see the new issue \"Send $TAG to Start9\"."
