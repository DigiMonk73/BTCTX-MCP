name: Publish image

# Multi-arch (amd64 + arm64) Docker image on GitHub Container Registry, run by
# the StartOS package (startos/):
#   ghcr.io/digimonk73/btctx-mcp:v<VERSION>  first build of each VERSION, never overwritten
#   ghcr.io/digimonk73/btctx-mcp:main        latest main
#   ghcr.io/digimonk73/btctx-mcp:sha-<sha>   every main commit
# The version comes from the VERSION file, so a release is: bump VERSION on main.
# release.yml also calls this, so a release never depends on main having
# published the version first.
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/digimonk73/btctx-mcp

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: tags
        run: |
          VERSION="v$(tr -d '[:space:]' < VERSION)"
          echo "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "bad VERSION: $VERSION"; exit 1; }
          TAGS=""
          SMOKE=""
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            TAGS="$IMAGE:main,$IMAGE:sha-${GITHUB_SHA::7}"
            SMOKE="$IMAGE:sha-${GITHUB_SHA::7}"
          fi
          # Version tags are immutable: only the first build of a VERSION gets it.
          if docker buildx imagetools inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "$VERSION already published; not overwriting"
          else
            TAGS="${TAGS:+$TAGS,}$IMAGE:$VERSION,$IMAGE:latest"
            SMOKE="${SMOKE:-$IMAGE:$VERSION}"
            echo "publishing $VERSION"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "smoke=$SMOKE" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        if: steps.tags.outputs.tags != ''
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the arm64 and amd64 images
        if: steps.tags.outputs.smoke != ''
        run: |
          for arch in amd64 arm64; do
            docker run --rm --platform linux/$arch "${{ steps.tags.outputs.smoke }}" \
              python -c "import backend.main, alembic; print('$arch ok')"
          done
