name: Publish image

# Multi-arch (amd64 + arm64) Docker image on GitHub Container Registry, run by
# the StartOS package (startos/):
#   ghcr.io/digimonk73/btctx-mcp:v<VERSION>  first build of each VERSION, never overwritten
#                                            (with :latest, for a release)
#   ghcr.io/digimonk73/btctx-mcp:main        latest main
#   ghcr.io/digimonk73/btctx-mcp:sha-<sha>   every main commit
# The version comes from the VERSION file, so a release is: bump VERSION on main.
# release.yml also calls this, so a release never depends on main having
# published the version first. A 2.0 pre-release (VERSION X.Y.Z-beta.N) gets
# only its version tag, never :latest or :main, and only from release.yml's
# run for prerelease/vX.Y.Z-beta.N (2.0 plan 7.4, B10a). The rules:
# scripts/image-tags.sh.
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/digimonk73/btctx-mcp

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: tags
        # Version tags are immutable: only the first build of a VERSION gets
        # one; a beta never :latest
        run: scripts/image-tags.sh >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: steps.tags.outputs.tags != ''
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the arm64 and amd64 images
        if: steps.tags.outputs.smoke != ''
        run: |
          for arch in amd64 arm64; do
            docker run --rm --platform linux/$arch "${{ steps.tags.outputs.smoke }}" \
              python -c "import backend.main, alembic; print('$arch ok')"
          done
