name: CI

# Every pull request, and every push to develop, main, staging or 2.0:
# lint, full Python suite, MCP tests, frontend, end-to-end smoke test,
# Playwright click-through tests (Chromium, WebKit), Docker image + container
# smoke, StartOS package checks and an x86_64 s9pk packed from this commit's
# image, dependency audit, and the macOS app build. A pull request's run
# tests the branch merged with its base, so pushing a branch that has one
# doesn't run the same suite twice (owner, 2026-10-13). A branch without a
# pull request: the pre-push hook's checks, or a run on demand from the
# Actions tab. A pull request into
# staging or 2.0 runs the medium set ("CI passed", below); every other pull
# request (into develop, main or any other branch) runs all of it. Every
# merge into staging or 2.0 starts all of it on the result, and a newer run
# there cancels the older, so the last run tests every change merged
# (AGENTS.md, "Branches").
on:
  push:
    branches: [develop, main, staging, "2.0"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # A pull request's older run is cancelled, and so is an older run of
  # staging or 2.0 (the newest run tests every change merged there; a
  # cancelled run's red "CI passed" is not a failure). A push to develop or
  # main is each merged commit's only run, and releases take their
  # downloads from it.
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/2.0' }}

permissions:
  contents: read

env:
  # start-cli for the StartOS jobs: Start9's newest release, the one their
  # builds pack with (startos/UPDATING.md, "Bumping the SDK", step 3), and
  # its start-cli_x86_64-linux SHA-256 from the release notes, checked before
  # it runs. release.yml repeats both
  START_CLI_VERSION: v2.5.0
  START_CLI_SHA256: 023f410cbad4b2971cb6ccdac117aaa27d80cc48eef52212a6f3755697962294

jobs:
  python:
    name: Python tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 = oldest supported (from source and the AI connector, #546),
        # 3.13 = Docker, StartOS and the Mac app (#284, #425). Both are in
        # "CI passed" (below), the one check develop's ruleset requires.
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      # Node runs the StartOS package's error-reading code in
      # test_startos_action_errors_465.py (type stripping: 22.6 or later)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install dependencies
        run: |
          pip install --require-hashes -r backend/requirements.txt
          pip install -r requirements-dev.txt ./mcp_server
      - name: Lint (bug-level)
        run: ruff check .
      - name: Static compatibility checks
        run: python backend/tests/pre_commit_tests.py --no-api
      # pytest-xdist: one worker per core. Each test has its own temp
      # database and data folder, so they run side by side (3,184 tests in
      # 83 s on 12 cores, against 16 min one at a time)
      - name: Full test suite (incl. slow stress tests)
        run: |
          mkdir -p frontend/dist
          pytest -q -n auto --durations=10

  frontend:
    name: Frontend lint + tests + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Type check + production build
        run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 3

  smoke:
    name: End-to-end smoke test
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-dist
          path: frontend/dist
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install --require-hashes -r backend/requirements.txt
      - run: python scripts/smoke_test.py

  e2e:
    # Playwright click-through tests of every UI flow against the real
    # backend (temp database, stubbed prices). Chromium runs in a US and a
    # UTC+ timezone; WebKit (the Mac app's engine) runs the US set. Each
    # test starts its own server on a fresh database, so the specs split
    # across machines (--shard) as they are; each machine keeps one worker.
    name: Click-through tests (${{ matrix.browser }} ${{ matrix.shard }})
    needs: frontend
    # The full set only (below: "The medium set"): skipped on a pull request
    # into staging or 2.0 and nowhere else (an allow-list)
    if: ${{ !(github.event_name == 'pull_request' && (github.base_ref == 'staging' || github.base_ref == '2.0')) }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { browser: chromium, shard: 1/3 }
          - { browser: chromium, shard: 2/3 }
          - { browser: chromium, shard: 3/3 }
          - { browser: webkit, shard: 1/2 }
          - { browser: webkit, shard: 2/2 }
    env:
      E2E_SKIP_BUILD: "1"
      BTCTX_PYTHON: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-dist
          path: frontend/dist
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install --require-hashes -r backend/requirements.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      # The browser builds, kept between runs for the same lock (the
      # system packages they need are installed every time)
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('frontend/package-lock.json') }}
      - run: npx playwright install --with-deps ${{ matrix.browser }}
        working-directory: frontend
      - name: Run (Chromium, Chicago + Tokyo)
        if: matrix.browser == 'chromium'
        run: npx playwright test --project=chicago --project=tokyo --shard=${{ matrix.shard }}
        working-directory: frontend
      - name: Run (WebKit, Chicago)
        if: matrix.browser == 'webkit'
        run: E2E_WEBKIT=1 npx playwright test --project=webkit --shard=${{ matrix.shard }}
        working-directory: frontend
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-${{ matrix.browser }}-${{ strategy.job-index }}
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  docker:
    name: Docker image + container smoke
    # The full set only (below: "The medium set"): skipped on a pull request
    # into staging or 2.0 and nowhere else (an allow-list)
    if: ${{ !(github.event_name == 'pull_request' && (github.base_ref == 'staging' || github.base_ref == '2.0')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: docker build -t btctx:ci .
      - name: Run container (throwaway volume)
        run: |
          docker run -d --name btctx -p 8080:80 btctx:ci
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:8080/ && exit 0
            sleep 2
          done
          docker logs btctx; exit 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install --require-hashes -r backend/requirements.txt  # httpx, for the smoke test
      - name: Smoke test the container (live prices)
        run: |
          # A fresh container logs its first-run setup code and keeps it on /data;
          # the smoke test claims the account with it, then the code is gone.
          docker logs btctx 2>&1 | grep -q "First-run setup code: "
          CODE=$(docker exec btctx cat /data/setup-code.txt)
          python scripts/smoke_test.py --url http://127.0.0.1:8080 \
            --user ci-owner --password ci-password-123 --setup-code "$CODE"
          docker exec btctx sh -c '! test -e /data/setup-code.txt'
      - name: Data lands on the /data volume
        run: docker exec btctx test -s /data/btctx.db -a -s /data/.btctx_secret_key
      - name: The app runs as its own user, btctx, never root (#202)
        run: |
          docker exec btctx grep -E '^Uid:\s+10001\s+10001\s+10001\s+10001$' /proc/1/status
          test -z "$(docker exec btctx find /data \( \! -user btctx -o \! -group btctx \) -print)"
      - name: Health endpoint and maintenance CLI (used by the StartOS package)
        run: |
          curl -sf http://127.0.0.1:8080/api/health | tee /dev/stderr | grep -q "\"version\":\"$(tr -d '[:space:]' < VERSION)\""
          docker exec -u btctx btctx python -m backend.cli migrate | grep -q "up to date"
          echo "ci-password-456" | docker exec -i -u btctx btctx python -m backend.cli set-password --password-stdin
          curl -sf -o /dev/null -X POST http://127.0.0.1:8080/api/login -H 'content-type: application/json' \
            -d '{"username":"ci-owner","password":"ci-password-456"}'
          docker exec -u btctx btctx python -m backend.cli recalculate
      - name: Upgrade a v0.7.0 database (schema migrations)
        run: |
          docker volume create btctx-upgrade
          docker run --rm -v btctx-upgrade:/data -v "$PWD/backend/tests/fixtures:/fx:ro" \
            btctx:ci cp /fx/v0_7_0.db /data/btctx.db
          start() {
            docker run -d --name "$1" -p 8081:80 -v btctx-upgrade:/data btctx:ci
            for i in $(seq 1 60); do
              curl -sf -o /dev/null http://127.0.0.1:8081/ && return 0
              sleep 2
            done
            docker logs "$1"; return 1
          }
          start btctx-up
          # Still the default login (with data): logging in needs the setup code
          CODE=$(docker exec btctx-up cat /data/setup-code.txt)
          python scripts/check_upgraded_instance.py --url http://127.0.0.1:8081 --setup-code "$CODE"
          test "$(docker exec btctx-up sh -c 'ls /data/backups/*.db | wc -l')" = 1
          # a restart on an up-to-date database changes nothing
          docker rm -f btctx-up
          start btctx-up2
          python scripts/check_upgraded_instance.py --url http://127.0.0.1:8081 --setup-code "$CODE"
          test "$(docker exec btctx-up2 sh -c 'ls /data/backups/*.db | wc -l')" = 1
      - name: Update from the published 1.2.8 image, whose /data is root's (#202)
        run: scripts/docker_update_check.sh btctx:ci
      - name: Container logs on failure
        if: failure()
        run: |
          docker logs btctx || true
          docker logs btctx-up || docker logs btctx-up2 || true

  startos:
    name: StartOS package checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: startos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # npm ci builds diskusage (bitcoin-core-startos, via mempool-startos)
          # from source: a Node whose headers can't build it fails here (#32)
          node-version: 24
          cache: npm
          cache-dependency-path: startos/package-lock.json
      - name: start-cli (the SDK's make rules list the package's files with it)
        run: |
          sudo curl -sSL -o /usr/local/bin/start-cli \
            "https://github.com/Start9Labs/start-technologies/releases/download/start-cli%2F${START_CLI_VERSION}/start-cli_x86_64-linux"
          echo "${START_CLI_SHA256}  /usr/local/bin/start-cli" | sha256sum -c -
          sudo chmod +x /usr/local/bin/start-cli && start-cli --version
      - run: npm ci
      # From start-sdk 3.1.0 the SDK's make formats startos/ instead of
      # rejecting unformatted source, so the check runs before it
      - name: Format check
        run: npm run format:check
      - name: Type check, SDK lint, bundle
        run: make javascript/index.js
      - name: Manifest (id, version vs VERSION, image tag, upgrade paths)
        run: node --no-deprecation scripts/check-manifest.mjs

  startos-pack:
    name: StartOS package pack (x86_64, image from this commit)
    # The full set only (below: "The medium set"): skipped on a pull request
    # into staging or 2.0 and nowhere else (an allow-list)
    if: ${{ !(github.event_name == 'pull_request' && (github.base_ref == 'staging' || github.base_ref == '2.0')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # npm ci builds diskusage (bitcoin-core-startos, via mempool-startos)
          # from source: a Node whose headers can't build it fails here (#32)
          node-version: 24
          cache: npm
          cache-dependency-path: startos/package-lock.json
      # Start9's guide asks for Docker 28.1 or later (environment-setup.md);
      # the runner's is older (Start9's own builds do the same). start-cli
      # takes the image with `docker image save --platform`, and from 2.4
      # makes the SquashFS image itself: no squashfs-tools
      - name: Docker (current release, containerd image store for multi-arch)
        uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70 # v5.5.0
        with:
          daemon-config: '{"features":{"containerd-snapshotter":true}}'
      - name: start-cli
        run: |
          sudo curl -sSL -o /usr/local/bin/start-cli \
            "https://github.com/Start9Labs/start-technologies/releases/download/start-cli%2F${START_CLI_VERSION}/start-cli_x86_64-linux"
          echo "${START_CLI_SHA256}  /usr/local/bin/start-cli" | sha256sum -c -
          sudo chmod +x /usr/local/bin/start-cli && start-cli --version
          docker version --format "Docker {{.Server.Version}}"
      - name: Build the image under the tag the manifest pins
        run: docker build -t "ghcr.io/digimonk73/btctx-mcp:v$(tr -d '[:space:]' < VERSION)" .
      - name: Pack (throwaway signing key, outside the checkout)
        working-directory: startos
        run: |
          npm ci
          mkdir -p ../../.startos
          openssl genpkey -algorithm Ed25519 -out ../../.startos/build.key.pem
          make x86
          start-cli s9pk inspect btctx_x86_64.s9pk manifest \
            | jq -e '.id == "btctx" and (.gitHash | endswith("-modified") | not)'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: btctx-s9pk-x86_64
          path: startos/btctx_x86_64.s9pk
          retention-days: 7

  # pip-audit reads only the lock entries for the machine it runs on, so the
  # locks are audited here on Linux (the Docker image) and in audit-macos
  # (the Mac app's pyobjc packages). This job's name is a required check on
  # develop: keep it.
  audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: pip-audit --disable-pip -r backend/requirements.txt -r desktop/requirements.txt -r .github/release-tools/requirements.txt
      - run: pip-audit -r requirements-dev.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: cd frontend && npm audit --audit-level=high

  audit-macos:
    name: Dependency vulnerability audit (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: pip-audit --disable-pip -r backend/requirements.txt -r desktop/requirements.txt

  macos-app:
    name: macOS app build + launch check
    # Every pull request too, those into staging and 2.0 included (about two
    # minutes, on macOS runners that don't hold up the Linux jobs), so
    # packaging breaks show up before a merge and a dependency update can
    # wait for it (MAINTENANCE.md, "The Mac app"); not a required check, so
    # a macOS hiccup never blocks one. Free on public repos.
    needs: [python, frontend]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: python
        with:
          python-version: "3.13"  # the Mac app's, on purpose and tested (#284): the newest in ci.yml's matrix
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Build the app (BitcoinTX, or BitcoinTX Preview for a pre-release)
        run: ./desktop/build-mac.sh
        env:
          # The Python set up above, never one the runner happens to have (#284)
          BTCTX_BUILD_PYTHON: ${{ steps.python.outputs.python-path }}
      - name: Launch the bundled app and check its API answers on its own port, its data in its own folder
        # Its name, executable and port from the build (scripts/mac-app.sh):
        # a pre-release's is BitcoinTX Preview, never the installed app (2.0
        # plan 7.4, B10a)
        run: scripts/mac-app.sh check
      - name: Zip and unsigned .dmg (same steps as release.yml)
        id: package
        run: scripts/mac-app.sh package >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # the files' own stem: the app's name, then -macOS
          name: ${{ steps.package.outputs.stem }}
          path: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.dmg }}
          retention-days: 7

  # The one check the rulesets require: every job above but the macOS build
  # and its audit (they run, as before, without blocking a merge). A job is
  # required by being listed here, so renaming or splitting one never needs
  # a ruleset changed.
  #
  # The medium set (the owner's choice, 2026-10-22): a pull request into
  # staging or 2.0, and only there (an allow-list: a pull request into any
  # other branch gets the full set), runs the Python suite on both versions
  # (every tax and figures test among them), lint, the frontend, the smoke
  # test, the StartOS checks and the audit, so a night's batch of pull
  # requests clears side by side within GitHub's runner limits; the macOS
  # build and its audit run there too, as on every pull request. Only
  # click-through, Docker and the StartOS pack are skipped there; they run
  # on every merge into staging or 2.0 (the full set, whose last run tests
  # every change merged) and on every other pull request. Only those three
  # can be skipped, and only there; anything else skipped (a job whose need
  # failed) fails this check.
  ci-passed:
    name: CI passed
    if: always()
    needs: [python, frontend, smoke, e2e, docker, startos, startos-pack, audit]
    runs-on: ubuntu-latest
    steps:
      - name: Every required job passed
        env:
          RESULTS: ${{ toJSON(needs) }}
          MEDIUM: ${{ github.event_name == 'pull_request' && (github.base_ref == 'staging' || github.base_ref == '2.0') }}
        run: |
          echo "$RESULTS" | jq -e --argjson medium "$MEDIUM" '
            to_entries | all(.value.result == "success"
              or ($medium and (.key == "e2e" or .key == "docker" or .key == "startos-pack")
                  and .value.result == "skipped"))'
