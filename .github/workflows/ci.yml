name: CI

# Every push and pull request: lint, full Python suite, MCP tests, frontend,
# end-to-end smoke test, Docker image + container smoke, StartOS package
# checks and an x86_64 s9pk packed from this commit's image, dependency audit.
# The macOS app build (slowest job) runs on every branch push and on demand
# from the Actions tab.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11"]   # 3.10 = oldest supported, 3.11 = Docker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install dependencies
        run: pip install -r backend/requirements.txt -r requirements-dev.txt ./mcp_server
      - name: Lint (bug-level)
        run: ruff check .
      - name: Static compatibility checks
        run: python backend/tests/pre_commit_tests.py --no-api
      - name: Full test suite (incl. slow stress tests)
        run: |
          mkdir -p frontend/dist
          pytest -q --durations=10

  frontend:
    name: Frontend lint + tests + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Type check + production build
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 3

  smoke:
    name: End-to-end smoke test
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r backend/requirements.txt
      - run: python scripts/smoke_test.py

  docker:
    name: Docker image + container smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t btctx:ci .
      - name: Run container (throwaway volume)
        run: |
          docker run -d --name btctx -p 8080:80 btctx:ci
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:8080/ && exit 0
            sleep 2
          done
          docker logs btctx; exit 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install httpx
      - name: Smoke test the container (live prices)
        run: python scripts/smoke_test.py --url http://127.0.0.1:8080
      - name: Data lands on the /data volume
        run: docker exec btctx test -s /data/btctx.db -a -s /data/.btctx_secret_key
      - name: Health endpoint and maintenance CLI (used by the StartOS package)
        run: |
          curl -sf http://127.0.0.1:8080/api/health | tee /dev/stderr | grep -q "\"version\":\"$(tr -d '[:space:]' < VERSION)\""
          docker exec btctx python -m backend.cli migrate | grep -q "up to date"
          echo "ci-password" | docker exec -i btctx python -m backend.cli set-password --password-stdin
          curl -sf -o /dev/null -X POST http://127.0.0.1:8080/api/login -H 'content-type: application/json' \
            -d '{"username":"admin","password":"ci-password"}'
          docker exec btctx python -m backend.cli recalculate
      - name: Upgrade a v0.7.0 database (schema migrations)
        run: |
          docker volume create btctx-upgrade
          docker run --rm -v btctx-upgrade:/data -v "$PWD/backend/tests/fixtures:/fx:ro" \
            btctx:ci cp /fx/v0_7_0.db /data/btctx.db
          start() {
            docker run -d --name "$1" -p 8081:80 -v btctx-upgrade:/data btctx:ci
            for i in $(seq 1 60); do
              curl -sf -o /dev/null http://127.0.0.1:8081/ && return 0
              sleep 2
            done
            docker logs "$1"; return 1
          }
          start btctx-up
          python scripts/check_upgraded_instance.py --url http://127.0.0.1:8081
          test "$(docker exec btctx-up sh -c 'ls /data/backups/*.db | wc -l')" = 1
          # a restart on an up-to-date database changes nothing
          docker rm -f btctx-up
          start btctx-up2
          python scripts/check_upgraded_instance.py --url http://127.0.0.1:8081
          test "$(docker exec btctx-up2 sh -c 'ls /data/backups/*.db | wc -l')" = 1
      - name: Container logs on failure
        if: failure()
        run: |
          docker logs btctx || true
          docker logs btctx-up || docker logs btctx-up2 || true

  startos:
    name: StartOS package checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: startos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: startos/package-lock.json
      - run: npm ci
      - name: Format
        run: npx prettier --check startos
      - name: Type check
        run: npm run check
      - name: SDK lint
        run: npm run lint
      - name: Bundle
        run: npm run build
      - name: Manifest (id, version vs VERSION, image tag, upgrade paths)
        run: node --no-deprecation scripts/check-manifest.mjs

  startos-pack:
    name: StartOS package pack (x86_64, image from this commit)
    runs-on: ubuntu-latest
    env:
      START_CLI_VERSION: v2.1.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: startos/package-lock.json
      - name: Tools (squashfs, start-cli, containerd image store)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q squashfs-tools squashfs-tools-ng
          sudo curl -sSL -o /usr/local/bin/start-cli \
            "https://github.com/Start9Labs/start-technologies/releases/download/start-cli%2F${START_CLI_VERSION}/start-cli_x86_64-linux"
          sudo chmod +x /usr/local/bin/start-cli && start-cli --version
          echo '{"features":{"containerd-snapshotter":true}}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
      - name: Build the image under the tag the manifest pins
        run: docker build -t "ghcr.io/digimonk73/btctx-mcp:v$(tr -d '[:space:]' < VERSION)" .
      - name: Pack (throwaway signing key, outside the checkout)
        working-directory: startos
        run: |
          npm ci
          mkdir -p ../../.startos
          openssl genpkey -algorithm Ed25519 -out ../../.startos/build.key.pem
          make x86
          start-cli s9pk inspect btctx_x86_64.s9pk manifest \
            | jq -e '.id == "btctx" and (.gitHash | endswith("-modified") | not)'
      - uses: actions/upload-artifact@v4
        with:
          name: btctx-s9pk-x86_64
          path: startos/btctx_x86_64.s9pk
          retention-days: 7

  audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: pip-audit -r backend/requirements.txt -r requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd frontend && npm audit --audit-level=high

  macos-app:
    name: macOS app build + launch check
    # Every branch push (not PRs, which would build the same commit twice), so
    # packaging breaks show up before a merge. Free on public repos.
    if: github.event_name != 'pull_request'
    needs: [python, frontend]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build BitcoinTX.app
        run: ./desktop/build-mac.sh
      - name: Launch the bundled app and check its API answers on :8765
        run: |
          APP=desktop/dist/BitcoinTX.app/Contents/MacOS/BitcoinTX
          test -x "$APP"
          "$APP" > app.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:8765/; then
              curl -sf http://127.0.0.1:8765/api/health | grep -q '"status":"ok"'
              code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8765/api/import/entries/preview -H 'content-type: application/json' -d '{"rows":[]}')
              echo "entries endpoint (anonymous) -> $code"; test "$code" = "401"
              pkill -f BitcoinTX.app || true
              exit 0
            fi
            sleep 2
          done
          cat app.log; exit 1
      - name: Zip and unsigned .dmg (same steps as release.yml)
        run: |
          ditto -c -k --keepParent desktop/dist/BitcoinTX.app BitcoinTX-macOS.zip
          mkdir dmg
          cp -R desktop/dist/BitcoinTX.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname BitcoinTX -srcfolder dmg -ov -format UDZO BitcoinTX-macOS.dmg
          hdiutil verify BitcoinTX-macOS.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: BitcoinTX-macOS
          path: |
            BitcoinTX-macOS.zip
            BitcoinTX-macOS.dmg
          retention-days: 7
