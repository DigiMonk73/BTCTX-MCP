name: IRS forms watch

# Weekly, all year: opens an issue (label claude, once while it's open) for
# each yearly step irs.gov calls for (scripts/irs_new_year.py --due):
# - the IRS's draft Form 8949 + Schedule D for a year newer than the final
#   forms, or a revision of it: ship it as the preview (usually spring);
# - the FINAL forms for the next year: add them (usually December–January).
# It also previews the current IRS DRAFT forms against the app's field map
# (log only). It checks develop, where the steps land (main only moves at a
# release); a push only runs the checks, never opens an issue. A run that
# can't reach irs.gov fails, so a lasting break doesn't go unnoticed.
# Steps: docs/IRS_ANNUAL_FORM_UPDATE.md.
on:
  schedule:
    - cron: "0 14 * * 1"   # Mondays 14:00 UTC
  workflow_dispatch:
  push:
    paths:
      - scripts/irs_new_year.py
      - .github/workflows/irs-forms-watch.yml
      - backend/services/reports/form_8949.py

permissions:
  contents: read
  issues: write

concurrency:
  group: irs-forms-watch-${{ github.event_name == 'push' && github.ref || 'develop' }}

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'develop' }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: pip install --require-hashes -r backend/requirements.txt
      - name: Preview the IRS draft forms (informational)
        run: python scripts/irs_new_year.py --draft
      - name: What irs.gov calls for
        id: due
        run: python scripts/irs_new_year.py --due due.json
      # Also when part of irs.gov didn't answer (the run still fails): what
      # was found gets its issue
      - name: Open an issue for each step (unless one is open)
        if: ${{ !cancelled() && github.event_name != 'push' && steps.due.outcome != 'skipped' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open_titles=$(gh issue list --state open --limit 500 --json title -q '.[].title')
          jq -c '.[]' due.json | while read -r step; do
            title=$(jq -r .title <<<"$step")
            if grep -Fxq -- "$title" <<<"$open_titles"; then
              echo "Already open: $title"
            else
              gh issue create --title "$title" --body "$(jq -r .body <<<"$step")" --label claude
            fi
          done
