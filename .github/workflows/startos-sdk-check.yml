name: StartOS SDK check

# Weekly: opens an issue when npm has a newer @start9labs/start-sdk than the
# exact version startos/package.json pins, so SDK upgrades are deliberate
# (startos/UPDATING.md, "Bumping the SDK").
on:
  schedule:
    - cron: '23 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare the pinned SDK with npm
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PINNED=$(jq -r '.dependencies["@start9labs/start-sdk"]' startos/package.json)
          LATEST=$(npm view @start9labs/start-sdk version)
          echo "pinned $PINNED, npm latest $LATEST"
          [ "$PINNED" = "$LATEST" ] && exit 0
          NEWER=$(printf '%s\n%s\n' "$PINNED" "$LATEST" | sort -V | tail -1)
          [ "$NEWER" = "$LATEST" ] || exit 0
          TITLE="start-sdk $LATEST is available (startos/ pins $PINNED)"
          if [ -n "$(gh issue list --state open --search "in:title \"start-sdk $LATEST\"" --json number --jq '.[0].number // empty')" ]; then
            echo "already tracked"; exit 0
          fi
          gh issue create --title "$TITLE" --body "$(printf 'npm has `@start9labs/start-sdk` %s; `startos/package.json` pins %s.\n\nRead the SDK CHANGELOG for breaking changes and the StartOS version it requires, then follow startos/UPDATING.md, "Bumping the SDK".' "$LATEST" "$PINNED")"
