name: Start9 watch

# Daily: what Start9 changed that BitcoinTX's StartOS package must follow
# (scripts/start9-watch.sh; startos/UPDATING.md, "Watching Start9"): a newer
# start-sdk or start-cli than develop pins, a StartOS or start-registry
# release, changes to Start9's packaging guide or shared package workflows, a
# failed build on the mirror or on Start9's fork, and changes on the fork not
# taken back. Each opens one issue, labelled start9. A schedule runs only from
# the default branch (main), so a change here starts at the next release;
# until then, run it by hand from develop (gh workflow run start9-watch.yml
# --ref develop) or scripts/start9-watch.sh.
on:
  schedule:
    - cron: '23 8 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # develop's pins, and start9-pull.sh --check's history
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: What Start9 changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/start9-watch.sh
