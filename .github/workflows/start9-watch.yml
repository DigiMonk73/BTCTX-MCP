name: Start9 watch

# Weekly, Mondays (the owner, 2026-10-31; it was written to run daily): what
# Start9 changed that BitcoinTX's StartOS package must follow
# (scripts/start9-watch.sh; startos/UPDATING.md, "Watching Start9"): a newer
# start-sdk or start-cli than develop pins, a StartOS or start-registry
# release, changes to Start9's packaging guide or shared package workflows, a
# failed build on the mirror or on Start9's fork, and changes on the fork not
# taken back. Each opens one issue, labelled start9; the Monday report
# (monday-report.yml) lists the open ones hours later. GitHub runs a schedule
# only from the default branch (main), so this file starts at the release
# that brings it there; until then each session runs scripts/start9-watch.sh
# (AGENTS.md, "Starting a session"). It runs develop's script, so a fix to
# the script needs no release.
on:
  schedule:
    - cron: '23 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# A manual run and the scheduled one never both miss the other's new issue
concurrency:
  group: start9-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 0   # develop's pins, and start9-pull.sh --check's history
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: What Start9 changed
        env:
          GH_TOKEN: ${{ github.token }}
          START9_FORK: ${{ vars.START9_FORK }}   # as release.yml finds the fork
        run: scripts/start9-watch.sh
