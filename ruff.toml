# Lint gate for pre-push and CI: only rules that catch real bugs
# (syntax errors, undefined names, broken comparisons). Style-only rules
# (unused imports etc.) are deliberately off to avoid churn.
target-version = "py310"
extend-exclude = ["desktop/build", "desktop/dist", "desktop/.venv", "frontend", "baseline-pdfs"]

[lint]
select = ["E9", "F63", "F7", "F82"]
