# Lint gate for pre-push and CI: all Pyflakes rules (undefined names, unused
# imports/variables, redefinitions), syntax errors, bare `except:`, and
# modern syntax (pyupgrade: list[str], X | None) in the app code.
# Pure-style rules (line length, import order) stay off.
target-version = "py310"
extend-exclude = ["desktop/build", "desktop/dist", "desktop/.venv", "frontend"]

[lint]
select = ["E9", "E722", "F", "UP"]

[lint.per-file-ignores]
# Tests and migrations keep the style they were written in.
"backend/tests/*" = ["UP"]
"mcp_server/tests/*" = ["UP"]
"backend/migrations/*" = ["UP"]
