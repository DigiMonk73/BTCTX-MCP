# Developer CLI config. The app migrates itself at startup
# (backend/migrations/runner.py); see docs/MAINTENANCE.md "Database migrations".
[alembic]
script_location = %(here)s/backend/migrations
prepend_sys_path = .
path_separator = os
# Leave empty to use DATABASE_FILE / DATABASE_URL like the app does.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
